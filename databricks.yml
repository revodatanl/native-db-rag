bundle:
  name: native-db-rag
  databricks_cli_version: ">= 1.3.0"

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds everything this bundle creates.
    default: main
  schema:
    description: Schema for the raw Confluence tables and everything derived from them.
    default: confluence_rag
  confluence_connection:
    description: Name of the Unity Catalog connection of type Confluence (created once in Catalog Explorer).
    default: confluence
  llm_model:
    description: Unity Gateway model service that answers the questions.
    default: system.ai.claude-sonnet-4-6
  judge_model:
    description: Unity Gateway model service that judges the answers in the evaluate job; a stronger model than llm_model.
    default: system.ai.claude-opus-5-5

# The wheel of this project, which the evaluate job installs (resources/evaluate.yml).
artifacts:
  default:
    type: whl
    path: .
    build: uv build --wheel

targets:
  dev:
    mode: development
    default: true
